<style>
        /* Woodblock style input overrides */
        .woodblock-input {
            border: 1px solid rgba(77, 100, 83, 0.2); /* secondary/20 */
            background-color: transparent;
            transition: all 0.3s ease;
        }
        .woodblock-input:focus {
            outline: none;
            border-color: #384d00; /* primary */
            box-shadow: 0 0 0 1px #384d00;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-parchment-base text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- TopAppBar (From JSON, adapted for onboarding - no nav) -->
<header class="bg-parchment-base dark:bg-ink-black text-primary font-headline-md text-headline-md w-full top-0 border-b border-secondary/10 transition-all duration-300 flex justify-center md:justify-between items-center px-margin-mobile md:px-margin-desktop py-4 sticky z-40">
<!-- Leading empty on onboarding typically, or a back button if applicable, but hiding based on intent -->
<div class="hidden md:flex flex-1"></div>
<div class="font-headline-lg text-headline-lg text-primary tracking-widest flex-shrink-0 text-center">NEWFIT</div>
<div class="hidden md:flex flex-1"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-md">
<!-- Contextual Header -->
<div class="mb-section-gap text-center relative">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background mb-4">Личные данные</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Расскажите немного о себе, чтобы мы могли настроить профиль.</p>
<!-- Decorative Divider -->
<div class="flex justify-center mt-6 opacity-30">
<svg fill="none" height="12" viewbox="0 0 120 12" width="120" xmlns="http://www.w3.org/2000/svg">
<path d="M0 6H50M70 6H120M60 2L64 6L60 10L56 6L60 2Z" stroke="#4d6453" stroke-width="1"></path>
</svg>
</div>
</div>
<!-- Form -->
<form action="#" class="space-y-6 relative z-10" method="POST">
<!-- Full Name Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-background mb-2" for="fullName">Ф.И.О.</label>
<input class="woodblock-input rounded-custom w-full px-4 py-3 font-headline-md text-[16px] leading-[24px] text-on-background placeholder:text-outline-variant" id="fullName" name="fullName" placeholder="Иван Иванов" required="" type="text"/>
</div>
<!-- Phone Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-background mb-2" for="phone">Телефон</label>
<input class="woodblock-input rounded-custom w-full px-4 py-3 font-headline-md text-[16px] leading-[24px] text-on-background placeholder:text-outline-variant" id="phone" name="phone" placeholder="+7 (999) 000-00-00" required="" type="tel"/>
</div>
<!-- Experience Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-background mb-2" for="experience">Опыт работы (лет)</label>
<input class="woodblock-input rounded-custom w-full px-4 py-3 font-headline-md text-[16px] leading-[24px] text-on-background placeholder:text-outline-variant" id="experience" max="50" min="0" name="experience" placeholder="0" required="" type="number"/>
</div>
<!-- Spacer -->
<div class="pt-8">
<!-- Submit Button -->
<button class="w-full bg-ink-black text-on-primary font-headline-md text-[18px] leading-[28px] py-4 px-6 rounded-custom uppercase tracking-wider transition-opacity hover:opacity-90 flex justify-center items-center gap-2" type="submit">
<span>ДАЛЕЕ</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
<!-- Suppressed Nav Shells for Transactional/Onboarding Page -->
<!-- Navigation Drawer & Bottom Nav are intentionally omitted here as per 'The "Semantic Shell" Mandate' -->
</body></html>
