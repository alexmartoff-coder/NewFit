<script>
        // Simple star rating logic
        document.addEventListener('DOMContentLoaded', () => {
            const stars = document.querySelectorAll('.star-btn');
            const container = document.getElementById('rating-container');
            let currentRating = 0;

            stars.forEach((star, index) => {
                star.addEventListener('click', () => {
                    currentRating = index + 1;
                    updateStars(currentRating);
                });

                star.addEventListener('mouseenter', () => {
                    updateStars(index + 1, true);
                });
            });

            container.addEventListener('mouseleave', () => {
                updateStars(currentRating);
            });

            function updateStars(rating, isHover = false) {
                stars.forEach((s, i) => {
                    const icon = s.querySelector('span');
                    if (i < rating) {
                        icon.style.fontVariationSettings = "'FILL' 1";
                        s.classList.add(isHover ? 'text-folklore-gold/70' : 'text-folklore-gold');
                        s.classList.remove('text-outline-variant');
                        if(!isHover) s.classList.remove('text-folklore-gold/70');
                    } else {
                        icon.style.fontVariationSettings = "'FILL' 0";
                        s.classList.remove('text-folklore-gold', 'text-folklore-gold/70');
                        s.classList.add('text-outline-variant');
                    }
                });
            }
        });
    </script>
