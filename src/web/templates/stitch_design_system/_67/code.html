<style>
        body {
            background-color: theme('colors.parchment-base');
            color: theme('colors.ink-black');
        }

        /* Custom Checkbox Style for Folklore Aesthetic */
        .folklore-checkbox {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 1px solid theme('colors.secondary');
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            position: relative;
            background-color: transparent;
            transition: all 0.2s ease-in-out;
        }

        .folklore-checkbox:checked {
            background-color: theme('colors.ink-black');
            border-color: theme('colors.ink-black');
        }

        .folklore-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 6px;
            width: 6px;
            height: 12px;
            border: solid theme('colors.parchment-base');
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .folklore-checkbox:focus {
            box-shadow: 0 0 0 2px theme('colors.secondary-container');
        }

        /* Input under-ledger style */
        .ledger-input {
            border: none;
            border-bottom: 1px solid theme('colors.secondary');
            border-radius: 3px 3px 0 0;
            background-color: theme('colors.paper-shadow');
        }
        .ledger-input:focus {
            outline: none;
            border-bottom: 2px solid theme('colors.ink-black');
            box-shadow: none;
        }
    </style>

<body class="min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-fixed selection:text-ink-black">
<!-- TopAppBar (Transactional - simplified) -->
<header class="bg-parchment-base dark:bg-ink-black w-full top-0 border-b border-secondary/10 flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 sticky z-40">
<div class="flex items-center gap-4">
<button aria-label="Назад" class="p-2 rounded-full hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-ink-black group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary tracking-widest font-bold">NEWFIT</h1>
</div>
<div class="text-label-sm font-label-sm text-secondary uppercase tracking-widest">
            Шаг 2 из 4
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-3px shadow-sm border border-secondary/10 p-8 md:p-12 relative overflow-hidden">
<!-- Ornamental decorative element top left -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-folklore-gold m-4 opacity-50"></div>
<!-- Ornamental decorative element bottom right -->
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-folklore-gold m-4 opacity-50"></div>
<div class="space-y-section-gap relative z-10">
<!-- Header -->
<div class="text-center md:text-left space-y-4">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-ink-black">
                        Локация и специализация
                    </h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                        Где вы находитесь и в чем ваша сильная сторона? Эти данные помогут клиентам найти именно вас.
                    </p>
</div>
<form class="space-y-12">
<!-- Location Section -->
<section class="space-y-6">
<div class="flex items-center gap-2 border-b border-secondary/20 pb-2">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">location_on</span>
<h3 class="font-headline-md text-headline-md text-ink-black">Локация</h3>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- City Dropdown -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant block" for="city">Город</label>
<div class="relative">
<select class="w-full ledger-input p-3 pl-4 pr-10 text-ink-black appearance-none transition-colors" id="city" name="city">
<option disabled="" selected="" value="">Выберите город</option>
<option value="moscow">Москва</option>
<option value="spb">Санкт-Петербург</option>
<option value="kazan">Казань</option>
<option value="yekaterinburg">Екатеринбург</option>
<option value="novosibirsk">Новосибирск</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-secondary">
<span class="material-symbols-outlined text-sm">expand_more</span>
</div>
</div>
</div>
<!-- District/Area Dropdown -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant block" for="district">Район / Метро (необязательно)</label>
<div class="relative">
<select class="w-full ledger-input p-3 pl-4 pr-10 text-ink-black appearance-none transition-colors" id="district" name="district">
<option disabled="" selected="" value="">Уточните район</option>
<option value="c">Центр</option>
<option value="n">Север</option>
<option value="s">Юг</option>
<option value="e">Восток</option>
<option value="w">Запад</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-secondary">
<span class="material-symbols-outlined text-sm">expand_more</span>
</div>
</div>
</div>
</div>
</section>
<!-- Specialization Section -->
<section class="space-y-6">
<div class="flex items-center gap-2 border-b border-secondary/20 pb-2">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">fitness_center</span>
<h3 class="font-headline-md text-headline-md text-ink-black">Специализация</h3>
</div>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">
                            Выберите основные направления (до 3-х), в которых вы являетесь экспертом.
                        </p>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<!-- Checkbox Item 1 -->
<label class="flex items-start gap-3 p-3 rounded-3px border border-transparent hover:bg-surface-variant/50 hover:border-secondary/20 transition-all cursor-pointer group">

</div>

<span class="text-xs text-on-surface-variant">Наращивание массы, пауэрлифтинг</span>
</div>
</label>
<!-- Checkbox Item 2 -->

</div>
<div class="flex flex-col">

</div>
</label>
<!-- Checkbox Item 3 -->

</div>
<div class="flex flex-col">

</div>
</label>

</div>
</label>
<!-- Checkbox Item 5 -->

<div class="flex-shrink-0 pt-0.5">
<input class="folklore-checkbox" name="spec" type="checkbox" value="martial"/>
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-ink-black font-semibold group-hover:text-primary transition-colors">Единоборства</span>
<span class="text-xs text-on-surface-variant">Бокс, ММА, борьба</span>
</div>
</label>
<!-- Checkbox Item 6 -->
<label class="flex items-start gap-3 p-3 rounded-3px border border-transparent hover:bg-surface-variant/50 hover:border-secondary/20 transition-all cursor-pointer group">

</div>

</div>
</label>
</div>
</section>
<!-- Form Actions -->
<div class="pt-8 flex justify-end">
<button class="bg-ink-black text-white hover:text-ink-black hover:bg-folklore-gold font-label-sm text-label-sm uppercase px-12 py-4 rounded-3px transition-all duration-300 shadow-md hover:shadow-lg flex items-center gap-2" type="submit">

</button>
</div>
</form>
</div>
</div>
</main>
