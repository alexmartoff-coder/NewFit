<style>

            border: 1px solid rgba(77, 100, 83, 0.2);

            content: '';
            position: absolute;
            inset: 2px;

            pointer-events: none;
        }

        .btn-corner-brackets {
            position: relative;
        }
        .btn-corner-brackets::before,
        .btn-corner-brackets::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border: 2px solid theme('colors.folklore-gold');
            transition: all 0.2s ease;
        }
        .btn-corner-brackets::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }
        .btn-corner-brackets::after {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }
        .btn-corner-brackets:hover::before,
        .btn-corner-brackets:hover::after {
            width: 12px;
            height: 12px;
