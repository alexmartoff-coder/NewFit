<!DOCTYPE html>

<html lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Выбор роли - NewFit</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#4b6700",
                        "on-background": "#191d10",
                        "surface-bright": "#f8fce5",
                        "folklore-gold": "#C5A059",
                        "tertiary-fixed": "#d5e4f7",
                        "ink-black": "#121212",
                        "parchment-base": "#F9F7F2",
                        "surface": "#f8fce5",
                        "on-secondary-fixed": "#0b2013",
                        "on-surface-variant": "#434933",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#a1d800",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#d8dcc7",
                        "surface-container": "#ecf0da",
                        "outline": "#737a61",
                        "surface-tint": "#4b6700",
                        "on-tertiary-fixed": "#0e1d2a",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#a1d800",
                        "on-tertiary": "#ffffff",
                        "tsar-red": "#A62C21",
                        "background": "#f8fce5",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-variant": "#e1e5cf",
                        "secondary-container": "#cde6d1",
                        "surface-container-highest": "#e1e5cf",
                        "inverse-surface": "#2e3223",
                        "secondary-fixed-dim": "#b4cdb8",
                        "primary-fixed": "#b8f600",
                        "on-primary": "#ffffff",
                        "primary-container": "#beff00",
                        "on-tertiary-container": "#5c6b7b",
                        "secondary-fixed": "#d0e9d4",
                        "on-tertiary-fixed-variant": "#3a4857",
                        "on-error": "#ffffff",
                        "on-primary-container": "#547300",
                        "on-secondary-container": "#516857",
                        "surface-container-low": "#f2f6e0",
                        "paper-shadow": "#EBE7DE",
                        "tertiary-fixed-dim": "#b9c8da",
                        "surface-container-high": "#e6ead4",
                        "tertiary-container": "#ddecff",
                        "outline-variant": "#c3caad",
                        "tertiary": "#516070",
                        "secondary": "#4d6453",
                        "on-secondary-fixed-variant": "#364c3c",
                        "on-surface": "#191d10",
                        "inverse-on-surface": "#eff3dd",
                        "on-primary-fixed": "#141f00",
                        "on-primary-fixed-variant": "#384e00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "64px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "max-width": "1280px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-xl": ["Libre Caslon Text"],
                        "label-sm": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "body-md": ["Manrope"],
                        "headline-lg-mobile": ["Libre Caslon Text"],
                        "headline-md": ["Libre Caslon Text"],
                        "headline-lg": ["Libre Caslon Text"]
                    },
                    "fontSize": {
                        "headline-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["13px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.parchment-base');
            color: theme('colors.on-background');
        }

        .role-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .role-card.selected {
            border-color: theme('colors.primary');
            background-color: theme('colors.surface-container-low');
            box-shadow: inset 0 0 0 2px theme('colors.primary');
        }

        .role-card.selected .icon-wrapper {
            background-color: theme('colors.primary-container');
            color: theme('colors.on-primary-container');
        }

        /* Ornamental Border Elements */
        .ornament-corner {
            position: absolute;
            width: 16px;
            height: 16px;
            border: 1px solid theme('colors.secondary');
            opacity: 0.3;
        }

        .ornament-tl { top: -8px; left: -8px; border-right: none; border-bottom: none; }
        .ornament-tr { top: -8px; right: -8px; border-left: none; border-bottom: none; }
        .ornament-bl { bottom: -8px; left: -8px; border-right: none; border-top: none; }
        .ornament-br { bottom: -8px; right: -8px; border-left: none; border-top: none; }

        /* Double line border */
        .double-border {
            position: relative;
            border: 1px solid rgba(77, 100, 83, 0.2); /* secondary/20 */
        }
        .double-border::after {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(77, 100, 83, 0.1); /* secondary/10 */
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop bg-parchment-base relative overflow-hidden">
<!-- Decorative Background Elements -->
<div class="fixed top-0 left-0 w-full h-32 bg-gradient-to-b from-surface-variant/50 to-transparent pointer-events-none"></div>
<div class="fixed bottom-0 left-0 w-full h-32 bg-gradient-to-t from-surface-variant/50 to-transparent pointer-events-none"></div>
<main class="w-full max-w-4xl mx-auto relative z-10 flex flex-col items-center text-center">
<!-- Logo -->
<div class="mb-12 relative w-32 h-32">
<img alt="NewFit Logo" class="w-full h-full object-cover rounded-full shadow-lg double-border" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDp6vEix_5VIywWxtuaUW2475hOa9-kZxErK_jR0Dl3xFOktcQkFkTv3DxX_15J4nyoknzov9fQi8Y0Rdtsb-bWE-nfNk8WF3Fs9Kx5xWjiRrybD7o-yJzN_dlZ22QQvpoHQo1DM1feyQV5N0Sdh0w3KpluJql4GTrQFMrkGuTb9KZlAVHVrleqDbtn7CAFCm5ZCDOlPdz7rlOEwqCyEBhFQ1pF4P8XmocYkr8T5INs9sATRKKWUsh4NR_wsGmkKno9uA"/>
<!-- Decorative framing for logo -->
<div class="absolute -inset-4 border border-folklore-gold/40 rounded-full animate-[spin_20s_linear_infinite] pointer-events-none"></div>
<div class="absolute -inset-2 border border-secondary/20 rounded-full animate-[spin_15s_linear_infinite_reverse] pointer-events-none"></div>
</div>
<!-- Header -->
<div class="space-y-4 mb-16 max-w-2xl">
<h1 class="font-headline-lg-mobile md:font-headline-xl text-headline-lg-mobile md:text-headline-xl text-on-background">
                Добро пожаловать в NewFit
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Выберите вашу роль, чтобы начать работу в экосистеме
            </p>
<!-- Divider -->
<div class="flex justify-center items-center py-4">
<div class="h-px w-16 bg-secondary/30"></div>
<div class="mx-4 w-2 h-2 rotate-45 bg-folklore-gold/50"></div>
<div class="h-px w-16 bg-secondary/30"></div>
</div>
</div>
<!-- Role Selection Cards -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 w-full max-w-3xl mb-12">
<!-- Client Card -->
<div class="role-card group relative bg-surface p-8 rounded-xl double-border" onclick="selectRole('client')">
<div class="ornament-corner ornament-tl"></div>
<div class="ornament-corner ornament-tr"></div>
<div class="ornament-corner ornament-bl"></div>
<div class="ornament-corner ornament-br"></div>
<div class="flex flex-col items-center space-y-6">
<div class="icon-wrapper w-20 h-20 rounded-full bg-surface-dim flex items-center justify-center transition-colors duration-300">
<span class="material-symbols-outlined text-4xl" data-icon="person_search" style="font-variation-settings: 'FILL' 0;">person_search</span>
</div>
<div class="space-y-2">
<h2 class="font-headline-md text-headline-md text-on-surface">Я клиент</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                            Ищу специалиста для занятий или услуг
                        </p>
</div>
</div>
</div>
<!-- Pro Card -->
<div class="role-card group relative bg-surface p-8 rounded-xl double-border" onclick="selectRole('pro')">
<div class="ornament-corner ornament-tl"></div>
<div class="ornament-corner ornament-tr"></div>
<div class="ornament-corner ornament-bl"></div>
<div class="ornament-corner ornament-br"></div>
<div class="flex flex-col items-center space-y-6">
<div class="icon-wrapper w-20 h-20 rounded-full bg-surface-dim flex items-center justify-center transition-colors duration-300">
<span class="material-symbols-outlined text-4xl" data-icon="emoji_events" style="font-variation-settings: 'FILL' 0;">emoji_events</span>
</div>
<div class="space-y-2">
<h2 class="font-headline-md text-headline-md text-on-surface">Я профи</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                            Хочу предлагать свои услуги и управлять расписанием
                        </p>
</div>
</div>
</div>
</div>
<!-- Continue Button -->
<div class="w-full max-w-sm">
<button class="w-full py-4 px-8 bg-surface-variant text-on-surface-variant font-label-sm text-label-sm tracking-widest rounded transition-all duration-300 opacity-50 cursor-not-allowed" disabled="" id="continueBtn" onclick="location.href = (typeof selectedRole !== 'undefined' &amp;&amp; selectedRole === 'pro') ? '/pro/profile/edit' : '/catalog';">
                ПРОДОЛЖИТЬ
            </button>
</div>
</main>
<script>
        let selectedRole = null;

        function selectRole(role) {
            selectedRole = role;

            // Update cards
            const cards = document.querySelectorAll('.role-card');
            cards.forEach(card => card.classList.remove('selected'));

            // Add selected class to clicked card
            const selectedCard = event.currentTarget;
            selectedCard.classList.add('selected');

            // Update button
            const btn = document.getElementById('continueBtn');
            btn.disabled = false;
            btn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
            btn.classList.add('bg-primary', 'text-ink-black', 'hover:bg-primary/90', 'shadow-md');

            // Simple animation for the button
            btn.style.transform = 'scale(0.98)';
            setTimeout(() => btn.style.transform = 'scale(1)', 150);
        }
    </script>
</body></html>
