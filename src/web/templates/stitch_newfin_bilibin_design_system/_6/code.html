<style>
        .custom-radio:checked + label {
            background-color: #beff00;
            color: #547300;
            border-color: #beff00;
        }

        /* Input underline styling */
        .input-underline {
            border: none;
            border-bottom: 1px solid #4d645333;
            background-color: transparent;
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
        }
        .input-underline:focus {
            box-shadow: none;
            border-bottom-color: #4b6700;
        }

        /* Checkbox styling */
        .custom-checkbox:checked {
            background-color: #4b6700;
            border-color: #4b6700;
        }

        .ornamental-border {
            position: relative;
        }
        .ornamental-border::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid rgba(77, 100, 83, 0.2);
            pointer-events: none;
            border-radius: 0.5rem;
        }
        .ornamental-border::after {
            content: '';
            position: absolute;
            inset: 3px;
            border: 1px solid rgba(77, 100, 83, 0.1);
            pointer-events: none;
            border-radius: 0.375rem;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased pb-24">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-inverse-surface fixed top-0 w-full z-50 border-b border-secondary/10 dark:border-secondary-fixed/10">
<div class="flex justify-between items-center px-margin-mobile h-16 w-full max-w-max-width mx-auto">
<button class="text-primary dark:text-primary-fixed p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors focus:outline-none focus:ring-2 focus:ring-primary" onclick="location.href='/pro/schedule';">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-semibold text-primary dark:text-primary-fixed">Генерация слотов</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</div>
</header>
<!-- Main Content -->
<main class="max-w-max-width mx-auto px-margin-mobile pt-24 pb-8 md:px-margin-desktop md:pt-32 flex flex-col gap-8">
<!-- Decorative Header Divider -->
<div class="flex justify-center items-center opacity-50">
<div class="h-px w-16 bg-secondary"></div>
<svg class="w-6 h-6 mx-4 text-secondary" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24">
<path d="M12 3v18m9-9H3m15.364-6.364l-12.728 12.728m0-12.728l12.728 12.728" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<div class="h-px w-16 bg-secondary"></div>
</div>
<!-- Planning Horizon -->
<section class="bg-surface-container-low p-6 rounded-xl ornamental-border shadow-sm">
<h2 class="font-headline-md text-headline-md mb-4 text-secondary">Горизонт планирования</h2>
<div class="flex flex-wrap gap-3">
<div class="relative">
<input checked="" class="custom-radio sr-only" id="horizon-7" name="horizon" type="radio"/>
<label class="cursor-pointer inline-flex items-center justify-center px-5 py-2.5 rounded-full border border-secondary/20 bg-parchment-base text-on-surface-variant font-label-sm text-label-sm transition-all hover:bg-surface-container-highest" for="horizon-7">
                        7 дней
                    </label>
</div>
<div class="relative">
<input class="custom-radio sr-only" id="horizon-14" name="horizon" type="radio"/>
<label class="cursor-pointer inline-flex items-center justify-center px-5 py-2.5 rounded-full border border-secondary/20 bg-parchment-base text-on-surface-variant font-label-sm text-label-sm transition-all hover:bg-surface-container-highest" for="horizon-14">
                        14 дней
                    </label>
</div>
<div class="relative">
<input class="custom-radio sr-only" id="horizon-30" name="horizon" type="radio"/>
<label class="cursor-pointer inline-flex items-center justify-center px-5 py-2.5 rounded-full border border-secondary/20 bg-parchment-base text-on-surface-variant font-label-sm text-label-sm transition-all hover:bg-surface-container-highest" for="horizon-30">
                        30 дней
                    </label>
</div>
</div>
</section>
<!-- Session Duration -->
<section class="bg-surface-container-low p-6 rounded-xl ornamental-border shadow-sm">
<h2 class="font-headline-md text-headline-md mb-4 text-secondary">Длительность занятия</h2>
<div class="flex flex-wrap gap-3">
<div class="relative">
<input checked="" class="custom-radio sr-only" id="duration-60" name="duration" type="radio"/>
<label class="cursor-pointer inline-flex items-center justify-center px-5 py-2.5 rounded-full border border-secondary/20 bg-parchment-base text-on-surface-variant font-label-sm text-label-sm transition-all hover:bg-surface-container-highest" for="duration-60">
                        60 мин
                    </label>
</div>
<div class="relative">
<input class="custom-radio sr-only" id="duration-90" name="duration" type="radio"/>
<label class="cursor-pointer inline-flex items-center justify-center px-5 py-2.5 rounded-full border border-secondary/20 bg-parchment-base text-on-surface-variant font-label-sm text-label-sm transition-all hover:bg-surface-container-highest" for="duration-90">
                        90 мин
                    </label>
</div>
<div class="relative">
<input class="custom-radio sr-only" id="duration-120" name="duration" type="radio"/>
<label class="cursor-pointer inline-flex items-center justify-center px-5 py-2.5 rounded-full border border-secondary/20 bg-parchment-base text-on-surface-variant font-label-sm text-label-sm transition-all hover:bg-surface-container-highest" for="duration-120">
                        120 мин
                    </label>
</div>
</div>
</section>
<!-- Working Hours (Weekdays) -->
<section class="bg-surface-container-low p-6 rounded-xl ornamental-border shadow-sm">
<h2 class="font-headline-md text-headline-md mb-6 text-secondary">Рабочие часы (Будни)</h2>
<div class="flex items-end gap-6 max-w-sm">
<div class="flex-1">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="weekday-start">От</label>
<input class="input-underline w-full font-body-md text-body-md text-on-surface focus:ring-0" id="weekday-start" type="time" value="09:00"/>
</div>
<span class="text-secondary pb-2">-</span>
<div class="flex-1">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="weekday-end">До</label>
<input class="input-underline w-full font-body-md text-body-md text-on-surface focus:ring-0" id="weekday-end" type="time" value="18:00"/>
</div>
</div>
</section>
<!-- Working Hours (Weekends) -->
<section class="bg-surface-container-low p-6 rounded-xl ornamental-border shadow-sm relative overflow-hidden group">
<div class="flex justify-between items-start mb-6">
<h2 class="font-headline-md text-headline-md text-secondary">Рабочие часы (Выходные)</h2>
<div class="flex items-center gap-2 mt-1">
<input checked="" class="custom-checkbox w-5 h-5 rounded text-primary focus:ring-primary border-secondary/30" id="weekend-off" type="checkbox"/>
<label class="font-label-sm text-label-sm text-on-surface-variant cursor-pointer" for="weekend-off">Выходные не рабочие</label>
</div>
</div>
<div class="flex items-end gap-6 max-w-sm transition-opacity duration-300 opacity-50 pointer-events-none" id="weekend-times">
<div class="flex-1">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="weekend-start">От</label>
<input class="input-underline w-full font-body-md text-body-md text-on-surface focus:ring-0" disabled="" id="weekend-start" type="time" value="10:00"/>
</div>
<span class="text-secondary pb-2">-</span>
<div class="flex-1">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="weekend-end">До</label>
<input class="input-underline w-full font-body-md text-body-md text-on-surface focus:ring-0" disabled="" id="weekend-end" type="time" value="15:00"/>
</div>
</div>
</section>
<!-- Generate Button -->
<div class="mt-4 pt-4 md:pt-8 md:mt-8 flex justify-center">
<button class="bg-primary-container text-ink-black font-label-sm text-label-sm py-4 px-8 rounded-full shadow-sm hover:shadow-md hover:bg-primary-fixed transition-all duration-200 w-full md:w-auto" onclick="alert('Слоты успешно сгенерированы!'); location.href='/pro/schedule';">
                Сгенерировать расписание
            </button>
</div>
</main>
<!-- BottomNavBar (Mobile Only per Semantic Shell Mandate for focused tasks this might be suppressed, but prompt requests it explicitly with "Schedule" active) -->
<!-- Assuming "Записи" (Records/Schedule) is active based on context -->
<nav class="bg-parchment-base dark:bg-inverse-surface fixed bottom-0 w-full z-50 rounded-t-xl border-t border-secondary/10 dark:border-secondary-fixed/10 flex justify-around items-center px-2 py-3 md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all" href="/catalog">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">search</span>
<span class="font-label-sm text-label-sm">Каталог</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 hover:text-primary transition-all opacity-80 duration-150 scale-95" href="/client/bookings">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
<span class="font-label-sm text-label-sm font-bold">Записи</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all" href="/pro/profile/edit">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-sm text-label-sm">Профиль</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">grid_view</span>
<span class="font-label-sm text-label-sm">Меню</span>
</a>
</nav>
<script>
        // Simple logic to toggle weekend time inputs based on checkbox
        document.getElementById('weekend-off').addEventListener('change', function() {
            const timeContainer = document.getElementById('weekend-times');
            const inputs = timeContainer.querySelectorAll('input');

            if (this.checked) {
                timeContainer.classList.add('opacity-50', 'pointer-events-none');
                inputs.forEach(input => input.disabled = true);
            } else {
                timeContainer.classList.remove('opacity-50', 'pointer-events-none');
                inputs.forEach(input => input.disabled = false);
            }
        });
    </script>
</body></html>
