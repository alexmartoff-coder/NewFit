<script>
        // Simple JS to ensure a category is selected before allowing 'Next' (visual only for mockup)
        document.addEventListener('DOMContentLoaded', () => {
            const nextButton = document.querySelector('footer button');
            const radios = document.querySelectorAll('.category-radio');

            // Initially dim the button to indicate required selection
            nextButton.style.opacity = '0.5';
            nextButton.style.cursor = 'not-allowed';

            radios.forEach(radio => {
                radio.addEventListener('change', () => {
                    nextButton.style.opacity = '1';
                    nextButton.style.cursor = 'pointer';
                });
            });
        });
