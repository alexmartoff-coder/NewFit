            border: 1px solid theme('colors.secondary');

            pointer-events: none;
            border-radius: theme('borderRadius.slavic');
        }
        .ornamental-bracket {

            width: 8px;

        .bracket-tl { top: -2px; left: -2px; border-width: 1.5px 0 0 1.5px; }
        .bracket-tr { top: -2px; right: -2px; border-width: 1.5px 1.5px 0 0; }
        .bracket-bl { bottom: -2px; left: -2px; border-width: 0 0 1.5px 1.5px; }
        .bracket-br { bottom: -2px; right: -2px; border-width: 0 1.5px 1.5px 0; }

</div>
<button class="w-full h-14 bg-primary text-ink-black font-label-sm text-label-sm rounded-slavic flex items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-primary shadow-sm" disabled="" id="nextBtn">
<span>Далее</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</footer>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.category-card');
            const nextBtn = document.getElementById('nextBtn');
            let selectedCategory = null;

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Reset all cards
                    cards.forEach(c => {
                        c.classList.remove('border-primary', 'bg-surface', 'shadow-md');
                        c.classList.add('border-secondary/20', 'bg-surface-container-lowest');
                        const indicator = c.querySelector('.selection-indicator');
                        indicator.classList.remove('opacity-100', 'border-primary');
                        indicator.classList.add('opacity-0', 'border-secondary/20');
                        indicator.querySelector('.inner-dot').classList.add('hidden');

                        // Reset icon fill
                        c.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
                    });

                    // Set active state for clicked card
                    card.classList.add('border-primary', 'bg-surface', 'shadow-md');
                    card.classList.remove('border-secondary/20', 'bg-surface-container-lowest');

                    const indicator = card.querySelector('.selection-indicator');
                    indicator.classList.remove('opacity-0', 'border-secondary/20');
                    indicator.classList.add('opacity-100', 'border-primary');
                    indicator.querySelector('.inner-dot').classList.remove('hidden');

                    // Fill icon on active
                    card.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";

                    // Enable Next button
                    selectedCategory = card.dataset.category;
                    nextBtn.disabled = false;
                });
            });
        });
    </script>
