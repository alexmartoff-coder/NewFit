<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">
<!-- Top Navigation for Context, suppressing shell since it's an onboarding flow, but keeping a simple header -->
<header class="w-full flex justify-center items-center py-6 px-margin-mobile border-b border-secondary/10 bg-surface">
<img alt="NewFit Logo" class="h-12 w-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBt5_FQ8mDuauJhUuvXA-rmQr4uXM5ueTYanPZVBt7R0zXKKX7Y-S3u5gsxh1v7wmhwCQW3wCox5XIFCOv2XyRp58oTFRzw0-uAiG8UYylkoqEIPxvrjPchJzi_cPmyFTPW6bj_Bd2SVsqhHXQt32lela14p-l00n-g_dO2L2PtdxS2Z_zED1UjHZZq9VrBybDeHbf7MRGQJxBSjmtfH8jNtHLQAkJlYnPFYWZVu-22WFFn9helH_hqSaktIu503p6xcA"/>
</header>
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="max-w-2xl w-full bg-surface-container-lowest p-8 md:p-12 border border-secondary/20 shadow-sm relative">
<!-- Corner Brackets (Ornamental) -->
<div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-folklore-gold m-2"></div>
<div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-folklore-gold m-2"></div>
<div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-folklore-gold m-2"></div>
<div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-folklore-gold m-2"></div>
<div class="mb-8">
<p class="font-label-sm text-secondary mb-2 tracking-widest uppercase">Шаг 3 из 4</p>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-primary mb-2">Цены и услуги</h1>
<p class="font-body-md text-on-surface-variant">Укажите стоимость ваших услуг и добавьте примеры работ.</p>
</div>
<!-- Divider -->
<div class="w-full h-px bg-gradient-to-r from-transparent via-secondary/30 to-transparent my-8"></div>
<form class="space-y-section-gap">
<!-- Pricing Section -->
<div class="space-y-6">
<h2 class="font-headline-md text-primary border-b border-secondary/10 pb-2 inline-block">Прайс-лист</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Input 1 -->
<div class="flex flex-col">
<label class="font-label-sm text-on-surface mb-1" for="price-single">Разовое посещение (₽)</label>
<div class="relative">
<input class="w-full bg-paper-shadow border-0 border-b-2 border-secondary focus:border-primary focus:ring-0 px-4 py-3 font-body-lg text-on-surface transition-colors" id="price-single" placeholder="0" type="number"/>
<span class="material-symbols-outlined absolute right-3 top-3 text-secondary">payments</span>
</div>
</div>
<!-- Input 2 -->
<div class="flex flex-col">
<label class="font-label-sm text-on-surface mb-1" for="price-package">Пакет из 12 занятий / Комплекс (₽)</label>
<div class="relative">
<input class="w-full bg-paper-shadow border-0 border-b-2 border-secondary focus:border-primary focus:ring-0 px-4 py-3 font-body-lg text-on-surface transition-colors" id="price-package" placeholder="0" type="number"/>
<span class="material-symbols-outlined absolute right-3 top-3 text-secondary">inventory_2</span>
</div>
</div>
</div>
</div>
<!-- Divider -->
<div class="flex justify-center my-8 text-secondary/30">
<span class="material-symbols-outlined text-xs">diamond</span>
</div>
<!-- Photo Gallery Section -->
<div class="space-y-6">
<div>
<h2 class="font-headline-md text-primary mb-1">Фотогалерея</h2>
<p class="font-body-md text-on-surface-variant text-sm">Загрузите до 5 фотографий профиля или работ</p>
</div>
<div class="grid grid-cols-2 md:grid-cols-3 gap-4">
<!-- Upload Button -->
<button class="aspect-square flex flex-col items-center justify-center border-2 border-dashed border-outline-variant bg-surface-container hover:bg-surface-container-high hover:border-primary transition-all group" type="button">
<span class="material-symbols-outlined text-4xl text-secondary group-hover:text-primary mb-2 transition-colors">add_photo_alternate</span>
<span class="font-label-sm text-secondary group-hover:text-primary transition-colors">Добавить</span>
</button>
<!-- Empty Slots (Visual hint) -->
</div>
</div>
<!-- Submit Button -->
<div class="pt-8">
<button class="w-full md:w-auto bg-primary-container text-white hover:text-ink-black hover:bg-lime-accent px-8 py-4 font-headline-md text-lg tracking-wide transition-all border border-transparent hover:border-ink-black flex items-center justify-center gap-2 group" type="button">
                        Завершить регистрацию

</button>
</div>
