<!DOCTYPE html>

<style>
        body {
            background-color: theme('colors.parchment-base');
            color: theme('colors.ink-black');
        }
        .bilibin-border {
            border: 1px solid theme('colors.secondary/20');
            box-shadow: inset 0 0 0 1px theme('colors.parchment-base'), inset 0 0 0 2px theme('colors.secondary/10');
        }
        .input-bilibin {
            border-bottom: 2px solid theme('colors.secondary/30');
            background-color: transparent;
            transition: border-color 0.2s;
        }
        .input-bilibin:focus {
            outline: none;
            border-bottom-color: theme('colors.primary');
        }
    </style>

<body class="min-h-screen pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="w-full top-0 border-b border-secondary/20 dark:border-secondary-fixed-dim/20 bg-parchment-base dark:bg-surface-dim flat no shadows flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 max-w-max-width mx-auto">
<div class="flex items-center gap-4">
<img alt="NewFin Logo" class="h-10 w-10 object-cover rounded-lg border border-secondary/20" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB0gxQp1uvEt968Lh8jQQrCC1IgUQ70JRtdb7_zyxfY4coScu4NZQjFXeribNChVuTesPwtDfnQ-n3UU4ANYG4iwIx5jmMXOK1mA6b6tJG3hBoEzAkz0MU6WUNCNpbX40ocqd_1foh2PmkG-Bpu_Z5X5NQg3ZdLXherX_DsKZwRsKuy7eYIjtiCYOtHq4tKCNeBCaPOYjIaH5p7e92rkxASY83sH75hH95kz_rKI1BPhMyGIS077xlPOPBkP5mlF7au5Q"/>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed">NewFit Specialist</h1>
</div>
<div class="flex items-center gap-4">
<button class="font-label-sm text-label-sm text-on-surface-variant hover:bg-paper-shadow/50 transition-colors cursor-pointer active:opacity-80 px-4 py-2 rounded-lg border border-secondary/20 flex items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">swap_horiz</span>
                Switch to Client
            </button>
<div class="h-10 w-10 rounded-full bg-paper-shadow border border-secondary/20 flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-secondary">person</span>
</div>
</div>
</header>
<main class="max-w-3xl mx-auto px-margin-mobile md:px-margin-desktop py-section-gap">
<div class="mb-8">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-ink-black mb-2">Новая запись</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Оформите визит клиента вручную, выбрав нужные параметры.</p>
</div>
<form class="space-y-8 bg-surface-container-lowest p-6 md:p-8 rounded-lg bilibin-border relative">
<!-- Decorative corners -->
<div class="absolute top-2 left-2 w-2 h-2 border-t border-l border-folklore-gold"></div>
<div class="absolute top-2 right-2 w-2 h-2 border-t border-r border-folklore-gold"></div>
<div class="absolute bottom-2 left-2 w-2 h-2 border-b border-l border-folklore-gold"></div>
<div class="absolute bottom-2 right-2 w-2 h-2 border-b border-r border-folklore-gold"></div>
<!-- Client Section -->
<section class="space-y-4">
<h3 class="font-headline-md text-headline-md text-primary flex items-center gap-2 border-b border-secondary/10 pb-2">
<span class="material-symbols-outlined text-folklore-gold">person_search</span>
                    Клиент
                </h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="client-search">Поиск по базе</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-2 text-secondary/50">search</span>
<input class="input-bilibin w-full pl-8 py-2 font-body-md text-body-md text-ink-black" id="client-search" placeholder="Имя или телефон..." type="text"/>
</div>
</div>
<div class="flex items-center justify-center pt-6">
<span class="font-label-sm text-label-sm text-secondary px-4">ИЛИ</span>
</div>
</div>
<div class="bg-surface-container-low p-4 rounded-lg border border-secondary/10 space-y-4">
<h4 class="font-label-sm text-label-sm text-ink-black mb-2">Новый клиент</h4>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="new-name">Имя Фамилия</label>
<input class="input-bilibin w-full py-1 font-body-md text-body-md text-ink-black" id="new-name" type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="new-phone">Телефон</label>
<input class="input-bilibin w-full py-1 font-body-md text-body-md text-ink-black" id="new-phone" type="tel"/>
</div>
</div>
</div>
</section>
<!-- Service Section -->
<section class="space-y-4">
<h3 class="font-headline-md text-headline-md text-primary flex items-center gap-2 border-b border-secondary/10 pb-2">
<span class="material-symbols-outlined text-folklore-gold">fitness_center</span>
                    Услуга
                </h3>
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
<label class="cursor-pointer group">
<input class="peer sr-only" name="service" type="radio"/>
<div class="p-4 rounded-lg border border-secondary/20 peer-checked:bg-primary-container peer-checked:border-primary-container peer-checked:text-on-primary-container hover:bg-paper-shadow transition-colors">
<div class="font-label-sm text-label-sm font-semibold mb-1">Персональная тренировка</div>
<div class="font-body-md text-body-md text-sm opacity-80">60 мин • ₽2500</div>
</div>
</label>
<label class="cursor-pointer group">
<input class="peer sr-only" name="service" type="radio"/>
<div class="p-4 rounded-lg border border-secondary/20 peer-checked:bg-primary-container peer-checked:border-primary-container peer-checked:text-on-primary-container hover:bg-paper-shadow transition-colors">
<div class="font-label-sm text-label-sm font-semibold mb-1">Массаж (Спорт)</div>
<div class="font-body-md text-body-md text-sm opacity-80">45 мин • ₽3000</div>
</div>
</label>
<label class="cursor-pointer group">
<input class="peer sr-only" name="service" type="radio"/>
<div class="p-4 rounded-lg border border-secondary/20 peer-checked:bg-primary-container peer-checked:border-primary-container peer-checked:text-on-primary-container hover:bg-paper-shadow transition-colors">
<div class="font-label-sm text-label-sm font-semibold mb-1">Консультация</div>
<div class="font-body-md text-body-md text-sm opacity-80">30 мин • ₽1500</div>
</div>
</label>
</div>
</section>
<!-- Date & Time Section -->
<section class="space-y-4">
<h3 class="font-headline-md text-headline-md text-primary flex items-center gap-2 border-b border-secondary/10 pb-2">
<span class="material-symbols-outlined text-folklore-gold">calendar_month</span>
                    Дата и Время
                </h3>
<div class="flex flex-col gap-1 md:w-1/2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="date-select">Выберите дату</label>
<input class="input-bilibin w-full py-2 font-body-md text-body-md text-ink-black bg-transparent" id="date-select" type="date"/>
</div>
<div class="pt-4">
<h4 class="font-label-sm text-label-sm text-on-surface-variant mb-3">Свободные слоты</h4>
<div class="flex flex-wrap gap-3">
<label class="cursor-pointer">
<input class="peer sr-only" name="time" type="radio"/>
<span class="inline-block px-4 py-2 rounded-lg border border-secondary/20 font-headline-md text-headline-md text-sm peer-checked:bg-primary peer-checked:text-on-primary hover:bg-paper-shadow transition-colors">10:00</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="time" type="radio"/>
<span class="inline-block px-4 py-2 rounded-lg border border-secondary/20 font-headline-md text-headline-md text-sm peer-checked:bg-primary peer-checked:text-on-primary hover:bg-paper-shadow transition-colors">11:30</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" disabled="" name="time" type="radio"/>
<span class="inline-block px-4 py-2 rounded-lg border border-secondary/10 font-headline-md text-headline-md text-sm text-secondary/40 bg-surface-dim cursor-not-allowed">14:00</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="time" type="radio"/>
<span class="inline-block px-4 py-2 rounded-lg border border-secondary/20 font-headline-md text-headline-md text-sm peer-checked:bg-primary peer-checked:text-on-primary hover:bg-paper-shadow transition-colors">16:00</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="time" type="radio"/>
<span class="inline-block px-4 py-2 rounded-lg border border-secondary/20 font-headline-md text-headline-md text-sm peer-checked:bg-primary peer-checked:text-on-primary hover:bg-paper-shadow transition-colors">18:30</span>
</label>
</div>
</div>
</section>
<!-- Submit -->
<div class="pt-6 border-t border-secondary/10 flex justify-end">
<button class="bg-primary text-on-primary hover:bg-ink-black hover:text-white transition-colors duration-200 font-label-sm text-label-sm px-8 py-3 rounded-lg shadow-sm flex items-center gap-2" type="button">
<span class="material-symbols-outlined" style="font-size: 18px;">check_circle</span>
                    Подтвердить запись
                </button>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 border-t border-secondary/10 dark:border-outline-variant/10 bg-parchment-base dark:bg-surface-container flat no shadows md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center pb-safe pt-2 px-2">
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:text-primary dark:hover:text-primary-fixed transition-colors active:scale-95 transition-transform duration-150 group" href="#">
<span class="material-symbols-outlined mb-1 group-hover:text-primary">calendar_today</span>
<span class="font-label-sm text-label-sm text-[10px]">Schedule</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-4 py-1 hover:text-primary dark:hover:text-primary-fixed transition-colors active:scale-95 transition-transform duration-150" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">groups</span>
<span class="font-label-sm text-label-sm text-[10px]">Clients</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:text-primary dark:hover:text-primary-fixed transition-colors active:scale-95 transition-transform duration-150 group" href="/client/profile">
<span class="material-symbols-outlined mb-1 group-hover:text-primary">account_circle</span>
<span class="font-label-sm text-label-sm text-[10px]">Profile</span>
</a>
</nav>
</body></html>
