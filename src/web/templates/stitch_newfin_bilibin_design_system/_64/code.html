<style>
        body {

            color: theme('colors.on-surface');

        }

        /* Ornamental Divider */
        .ornamental-divider {
            position: relative;
            height: 1px;
            background: linear-gradient(to right, transparent, theme('colors.secondary') 50%, transparent);
            opacity: 0.2;
        }
        .ornamental-divider::before {
            content: '';
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 7px;
            height: 7px;
            border: 1px solid theme('colors.secondary');
        }

        /* Tech-Folklore Button */
        .btn-primary-tech {
            position: relative;
            border-radius: theme('borderRadius.3px');
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .btn-primary-tech::before {
            content: '';
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 1px;
            pointer-events: none;
